name: PivMusic Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pivmusic-release
  cancel-in-progress: false

jobs:
  android:
    name: Build and publish PivMusic APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          test -n "$version" && test -n "$code"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building PivMusic $version (versionCode $code)"

      - name: Build signed production APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleProdRelease --no-daemon --stacktrace

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk \
            "dist/PivMusic-${{ steps.version.outputs.version }}-vc${{ steps.version.outputs.code }}-universal.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PivMusic ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.apk
